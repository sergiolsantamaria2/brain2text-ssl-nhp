<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 424" width="770" height="424" role="img" aria-label="Validation PER over a 400k-batch finetuning run on T15. AR-Binary causal somatosensory pretraining ends at 0.0887, bidirectional at 0.0892, and the no-SSL transformer at 0.0949.">
  <style>
    .bg     { fill: #f6f8fa; }
    .grid   { stroke: #d8dee4; stroke-width: 1; }
    .border { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .tick   { fill: #656d76; font-size: 11px; }
    .axlab  { fill: #1f2328; font-size: 12px; font-weight: 500; }
    .title  { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .sub    { fill: #656d76; font-size: 11.5px; }
    .lgbox  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .lgtxt  { fill: #1f2328; font-size: 11.5px; }
    .causal { stroke: #0969da; }
    .bidir  { stroke: #bc4c00; }
    .ctrl   { stroke: #8c959f; }
    .t-causal { fill: #0969da; }
    .t-bidir  { fill: #bc4c00; }
    .t-ctrl   { fill: #8c959f; }
    .curve  { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <text class="title" x="26" y="28">Somatosensory AR-Binary pretraining vs. no pretraining</text>
  <text class="sub" x="26" y="46">Validation PER on T15 · all three trained from the same 400k-batch schedule</text>

  <rect class="bg" x="90.0" y="70.0" width="570.0" height="280.0"/>
  <g>
    <line class="grid" x1="90.0" y1="70.0" x2="660.0" y2="70.0"/>
    <line class="grid" x1="90.0" y1="144.7" x2="660.0" y2="144.7"/>
    <line class="grid" x1="90.0" y1="219.3" x2="660.0" y2="219.3"/>
    <line class="grid" x1="90.0" y1="294.0" x2="660.0" y2="294.0"/>
    <line class="grid" x1="90.0" y1="331.3" x2="660.0" y2="331.3"/>
    <line class="grid" x1="232.5" y1="70.0" x2="232.5" y2="350.0"/>
    <line class="grid" x1="375.0" y1="70.0" x2="375.0" y2="350.0"/>
    <line class="grid" x1="517.5" y1="70.0" x2="517.5" y2="350.0"/>
  </g>
  <rect class="border" x="90.0" y="70.0" width="570.0" height="280.0"/>

  <g>
    <text class="tick" x="80.0" y="74.0" text-anchor="end">0.16</text>
    <text class="tick" x="80.0" y="148.7" text-anchor="end">0.14</text>
    <text class="tick" x="80.0" y="223.3" text-anchor="end">0.12</text>
    <text class="tick" x="80.0" y="298.0" text-anchor="end">0.10</text>
    <text class="tick" x="80.0" y="335.3" text-anchor="end">0.09</text>
    <text class="tick" x="90.0" y="372.0" text-anchor="middle">0</text>
    <text class="tick" x="232.5" y="372.0" text-anchor="middle">100k</text>
    <text class="tick" x="375.0" y="372.0" text-anchor="middle">200k</text>
    <text class="tick" x="517.5" y="372.0" text-anchor="middle">300k</text>
    <text class="tick" x="660.0" y="372.0" text-anchor="middle">400k</text>
  </g>
  <text class="axlab" x="375.0" y="392.0" text-anchor="middle">Finetuning step (batches)</text>
  <text class="axlab" x="20" y="210.0" text-anchor="middle" transform="rotate(-90, 20, 210.0)">Validation PER</text>

  <path class="curve ctrl"   stroke-dasharray="6 4" d="M 118.5,107.3 L 147.0,178.3 L 175.5,196.9 L 204.0,211.9 L 232.5,223.1 L 261.0,232.4 L 289.5,241.7 L 318.0,249.2 L 346.5,254.8 L 375.0,262.3 L 403.5,267.9 L 432.0,273.5 L 460.5,280.9 L 489.0,286.5 L 517.5,292.1 L 546.0,297.7 L 574.5,303.3 L 603.0,307.8 L 631.5,311.2 L 660.0,313.0"/>
  <path class="curve bidir"  d="M 118.5,114.8 L 147.0,193.2 L 175.5,219.3 L 204.0,236.1 L 232.5,247.3 L 261.0,256.7 L 289.5,266.0 L 318.0,273.5 L 346.5,280.9 L 375.0,286.5 L 403.5,292.1 L 432.0,298.5 L 460.5,304.5 L 489.0,309.7 L 517.5,314.5 L 546.0,320.1 L 574.5,325.0 L 603.0,329.5 L 631.5,332.5 L 660.0,334.3"/>
  <path class="curve causal" stroke-width="2.4" d="M 118.5,105.5 L 147.0,176.4 L 175.5,196.2 L 204.0,211.1 L 232.5,223.1 L 261.0,236.1 L 289.5,248.5 L 318.0,257.4 L 346.5,266.0 L 375.0,273.5 L 403.5,280.9 L 432.0,289.5 L 460.5,296.6 L 489.0,303.3 L 517.5,310.8 L 546.0,317.1 L 574.5,323.1 L 603.0,328.3 L 631.5,332.8 L 660.0,336.2"/>

  <circle class="t-ctrl"   cx="660.0" cy="313.0" r="3.5"/>
  <circle class="t-bidir"  cx="660.0" cy="334.3" r="3.5"/>
  <circle class="t-causal" cx="660.0" cy="336.2" r="4.5"/>

  <text class="t-ctrl"   x="668.0" y="317.0" font-size="12" font-weight="600">0.0949</text>
  <text class="t-bidir"  x="668.0" y="331.3" font-size="12" font-weight="600">0.0892</text>
  <text class="t-causal" x="668.0" y="349.2" font-size="12.5" font-weight="700">0.0887</text>

  <g>
    <rect class="lgbox" x="366" y="86" width="286" height="74" rx="4"/>
    <line class="curve causal" stroke-width="2.5" x1="380" y1="106" x2="402" y2="106"/>
    <text class="lgtxt" x="410" y="110" font-weight="600">AR-Binary (causal), somatosensory</text>
    <line class="curve bidir" stroke-width="2.5" x1="380" y1="126" x2="402" y2="126"/>
    <text class="lgtxt" x="410" y="130">AR-Binary (bidirectional), somatosensory</text>
    <line class="curve ctrl" stroke-width="2.5" stroke-dasharray="6 4" x1="380" y1="146" x2="402" y2="146"/>
    <text class="lgtxt" x="410" y="150">no-SSL transformer (control)</text>
  </g>

  <text class="sub" x="26" y="414">Final values measured; intermediate trajectories are schematic.</text>
  <text class="t-causal" x="660.0" y="414" text-anchor="end" font-size="11.5" font-weight="600">6.5&#8202;% relative improvement</text>
</svg>
