<svg viewBox="0 0 770 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <!-- Background (white) -->
  <rect width="770" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="600">Full 400k-batch finetuning on T15</text>
  <text x="380" y="54" text-anchor="middle" fill="#555" font-size="12" font-weight="400">AR-Binary somatosensory pretraining vs no-SSL transformer, same schedule</text>

  <!-- Plot area: x 80-680, y 80-390. PER range 0.085-0.16 -->
  <rect x="80" y="80" width="600" height="310" fill="#fafbfc"/>

  <!-- Horizontal grid -->
  <g stroke="#1a1a1a" stroke-opacity="0.08" stroke-width="1">
    <line x1="80" y1="80" x2="680" y2="80"/>
    <line x1="80" y1="163" x2="680" y2="163"/>
    <line x1="80" y1="245" x2="680" y2="245"/>
    <line x1="80" y1="328" x2="680" y2="328"/>
    <line x1="80" y1="369" x2="680" y2="369"/>
  </g>

  <!-- Vertical grid at 100k, 200k, 300k -->
  <g stroke="#1a1a1a" stroke-opacity="0.08" stroke-width="1">
    <line x1="230" y1="80" x2="230" y2="390"/>
    <line x1="380" y1="80" x2="380" y2="390"/>
    <line x1="530" y1="80" x2="530" y2="390"/>
  </g>

  <!-- Y axis labels -->
  <g fill="#555" font-size="11" text-anchor="end">
    <text x="72" y="84">0.16</text>
    <text x="72" y="167">0.14</text>
    <text x="72" y="249">0.12</text>
    <text x="72" y="332">0.10</text>
    <text x="72" y="373">0.09</text>
  </g>

  <!-- X axis labels -->
  <g fill="#555" font-size="11" text-anchor="middle">
    <text x="80" y="410">0</text>
    <text x="230" y="410">100k</text>
    <text x="380" y="410">200k</text>
    <text x="530" y="410">300k</text>
    <text x="680" y="410">400k</text>
  </g>

  <!-- Axis labels -->
  <text x="380" y="436" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="500">Training step</text>
  <text x="22" y="235" text-anchor="middle" fill="#1a1a1a" font-size="12" font-weight="500" transform="rotate(-90, 22, 235)">Validation PER</text>

  <!-- Plot box border -->
  <rect x="80" y="80" width="600" height="310" fill="none" stroke="#1a1a1a" stroke-opacity="0.18" stroke-width="1"/>

  <!-- No-SSL TFS curve (gray, dashed — control baseline) -->
  <path d="M 80,101 L 110,183 140,237 170,266 200,287 230,299 260,307 290,316 320,320 350,324 380,328 410,332 440,336 470,340 500,344 530,347 560,347 590,348 620,349 650,349 680,349"
        fill="none" stroke="#7f7f7f" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AR-Binary (bidirectional) curve (orange) -->
  <path d="M 80,121 L 110,212 140,262 170,291 200,311 230,324 260,332 290,340 320,347 350,351 380,355 410,359 440,362 470,364 500,366 530,368 560,370 590,371 620,372 650,373 680,373"
        fill="none" stroke="#ff7f0e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AR-Binary (causal) curve (blue — the headline winner) -->
  <path d="M 80,101 L 110,192 140,245 170,274 200,295 230,307 260,316 290,324 320,330 350,336 380,340 410,347 440,351 470,355 500,359 530,363 560,367 590,370 620,373 650,374 680,375"
        fill="none" stroke="#1f77b4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpoint markers -->
  <circle cx="680" cy="349" r="4" fill="#7f7f7f" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="680" cy="373" r="4" fill="#ff7f0e" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="680" cy="375" r="5" fill="#1f77b4" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="680" cy="375" r="9" fill="none" stroke="#1f77b4" stroke-width="1.2" opacity="0.45"/>

  <!-- Endpoint labels -->
  <line x1="680" y1="349" x2="690" y2="349" stroke="#7f7f7f" stroke-width="1.5"/>
  <text x="694" y="353" fill="#7f7f7f" font-size="12" font-weight="600">0.0949</text>

  <line x1="680" y1="373" x2="690" y2="373" stroke="#ff7f0e" stroke-width="1.5"/>
  <text x="694" y="370" fill="#ff7f0e" font-size="12" font-weight="600">0.0892</text>

  <line x1="680" y1="375" x2="690" y2="375" stroke="#1f77b4" stroke-width="2"/>
  <text x="694" y="384" fill="#1f77b4" font-size="13" font-weight="700">0.0887</text>

  <!-- −6.5% annotation (top-right inside plot) -->
  <text x="668" y="100" text-anchor="end" fill="#1a1a1a" font-size="11" opacity="0.7" font-style="italic">−6.5% relative vs no-SSL at the same budget</text>

  <!-- Legend (bottom-right, inside plot area) -->
  <g font-size="11" fill="#1a1a1a">
    <rect x="448" y="290" width="220" height="78" fill="#ffffff" opacity="0.94" rx="3" stroke="#1a1a1a" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="460" y1="305" x2="478" y2="305" stroke="#1f77b4" stroke-width="2.5"/>
    <text x="484" y="309" font-weight="600">AR-Binary (causal)</text>
    <text x="660" y="309" text-anchor="end" font-weight="600" fill="#1f77b4">0.0887</text>

    <line x1="460" y1="328" x2="478" y2="328" stroke="#ff7f0e" stroke-width="2.5"/>
    <text x="484" y="332">AR-Binary (bidirectional)</text>
    <text x="660" y="332" text-anchor="end" fill="#ff7f0e">0.0892</text>

    <line x1="460" y1="351" x2="478" y2="351" stroke="#7f7f7f" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="484" y="355">no-SSL transformer</text>
    <text x="660" y="355" text-anchor="end" fill="#7f7f7f">0.0949</text>
  </g>
</svg>
