<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Grid of NHP pretraining partition against self-supervised objective. Only somatosensory cortex paired with AR-Binary falls below the no-pretraining control of 0.124: 0.118 causal and 0.116 bidirectional. Every motor-cortex cell is at or above the control.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #e6edf3; font-size: 15px; font-weight: 600; }
    .sub   { fill: #8b949e; font-size: 11.5px; }
    .head  { fill: #8b949e; font-size: 11.5px; font-weight: 600; }
    .row   { fill: #e6edf3; font-size: 12.5px; font-weight: 600; }
    .hrs   { fill: #6e7681; font-size: 11px; }
    .val   { fill: #e6edf3; font-size: 14px; font-weight: 600; }
    .val-good { fill: #56d364; font-size: 15px; font-weight: 700; }
    .val-bad  { fill: #ff7b72; font-size: 14px; font-weight: 600; }
    .cell  { stroke: #30363d; stroke-width: 1; }
    .empty { fill: none; }
    .good  { fill: #3fb950; }
    .bad   { fill: #f85149; }
    .ctlrow { fill: #161b22; stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 3; }
    .ring  { fill: none; stroke: #3fb950; stroke-width: 2; }
    .sep   { stroke: #30363d; stroke-width: 1; }
  </style>
  <text class="title" x="26.0" y="28">Only one pairing of cortical region and objective transfers</text>
  <text class="sub" x="26.0" y="47">Monitoring PER on T15 (30k-batch finetuning of the best checkpoint) · lower is better</text>
  <text class="sub" x="26.0" y="64">Pretrained on macaque data only — no human data enters the pretraining stage</text>
  <text class="head" x="325.0" y="96.0" text-anchor="middle">Masked reconstruction</text>
  <text class="head" x="492.0" y="96.0" text-anchor="middle">AR-Binary (causal)</text>
  <text class="head" x="659.0" y="96.0" text-anchor="middle">AR-Binary (bidirectional)</text>
  <g>
    <text class="row" x="26.0" y="128.0">Control (no pretraining)</text>
    <rect class="ctlrow" x="246.0" y="106.0" width="158.0" height="42.0" rx="4"/>
    <text class="val" x="325.0" y="132.0" text-anchor="middle" opacity="0.75">0.124</text>
    <rect class="ctlrow" x="413.0" y="106.0" width="158.0" height="42.0" rx="4"/>
    <text class="val" x="492.0" y="132.0" text-anchor="middle" opacity="0.75">0.124</text>
    <rect class="ctlrow" x="580.0" y="106.0" width="158.0" height="42.0" rx="4"/>
    <text class="val" x="659.0" y="132.0" text-anchor="middle" opacity="0.75">0.124</text>
  </g>
  <g>
    <text class="row" x="26.0" y="190.0">Reaching</text>
    <text class="hrs" x="240.0" y="190.0" text-anchor="end">117 h</text>
    <rect class="cell empty" x="246.0" y="168.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="246.0" y="168.0" width="158.0" height="42.0" rx="4" opacity="0.52"/>
    <text class="val-bad" x="325.0" y="194.0" text-anchor="middle">0.142</text>
    <rect class="cell empty" x="413.0" y="168.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="413.0" y="168.0" width="158.0" height="42.0" rx="4" opacity="0.20"/>
    <text class="val-bad" x="492.0" y="194.0" text-anchor="middle">0.129</text>
    <rect class="cell empty" x="580.0" y="168.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="580.0" y="168.0" width="158.0" height="42.0" rx="4" opacity="0.10"/>
    <text class="val-bad" x="659.0" y="194.0" text-anchor="middle">0.125</text>
  </g>
  <g>
    <text class="row" x="26.0" y="238.0">Fine motor</text>
    <text class="hrs" x="240.0" y="238.0" text-anchor="end">68 h</text>
    <rect class="cell empty" x="246.0" y="216.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="246.0" y="216.0" width="158.0" height="42.0" rx="4" opacity="0.57"/>
    <text class="val-bad" x="325.0" y="242.0" text-anchor="middle">0.203</text>
    <rect class="cell empty" x="413.0" y="216.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="413.0" y="216.0" width="158.0" height="42.0" rx="4" opacity="0.30"/>
    <text class="val-bad" x="492.0" y="242.0" text-anchor="middle">0.133</text>
    <rect class="cell empty" x="580.0" y="216.0" width="158.0" height="42.0" rx="4"/>
    <text class="val" x="659.0" y="242.0" text-anchor="middle">0.124</text>
  </g>
  <g>
    <text class="row" x="26.0" y="286.0">Somatosensory</text>
    <text class="hrs" x="240.0" y="286.0" text-anchor="end">10 h</text>
    <rect class="cell empty" x="246.0" y="264.0" width="158.0" height="42.0" rx="4"/>
    <text class="val" x="325.0" y="290.0" text-anchor="middle">0.124</text>
    <rect class="cell empty" x="413.0" y="264.0" width="158.0" height="42.0" rx="4"/>
    <rect class="good" x="413.0" y="264.0" width="158.0" height="42.0" rx="4" opacity="0.32"/>
    <rect class="ring" x="414.0" y="265.0" width="156.0" height="40.0" rx="3.5"/>
    <text class="val-good" x="492.0" y="290.0" text-anchor="middle">0.118</text>
    <rect class="cell empty" x="580.0" y="264.0" width="158.0" height="42.0" rx="4"/>
    <rect class="good" x="580.0" y="264.0" width="158.0" height="42.0" rx="4" opacity="0.38"/>
    <rect class="ring" x="581.0" y="265.0" width="156.0" height="40.0" rx="3.5"/>
    <text class="val-good" x="659.0" y="290.0" text-anchor="middle">0.116</text>
  </g>
  <g>
    <text class="row" x="26.0" y="334.0">All NHP</text>
    <text class="hrs" x="240.0" y="334.0" text-anchor="end">200 h</text>
    <rect class="cell empty" x="246.0" y="312.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="246.0" y="312.0" width="158.0" height="42.0" rx="4" opacity="0.40"/>
    <text class="val-bad" x="325.0" y="338.0" text-anchor="middle">0.137</text>
    <rect class="cell empty" x="413.0" y="312.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="413.0" y="312.0" width="158.0" height="42.0" rx="4" opacity="0.42"/>
    <text class="val-bad" x="492.0" y="338.0" text-anchor="middle">0.138</text>
    <rect class="cell empty" x="580.0" y="312.0" width="158.0" height="42.0" rx="4"/>
    <rect class="bad" x="580.0" y="312.0" width="158.0" height="42.0" rx="4" opacity="0.57"/>
    <text class="val-bad" x="659.0" y="338.0" text-anchor="middle">0.145</text>
  </g>
  <line class="sep" x1="26.0" y1="156.0" x2="738.0" y2="156.0"/>
  <g>
    <rect class="good" x="26.0" y="371.0" width="11" height="11" rx="2" opacity="0.55"/>
    <text class="sub" x="43.0" y="380.0">better than control</text>
    <rect class="bad" x="154.0" y="371.0" width="11" height="11" rx="2" opacity="0.40"/>
    <text class="sub" x="171.0" y="380.0">worse than control (deeper = worse)</text>
    <text class="sub" x="738.0" y="380.0" text-anchor="end">Thesis Table 8.1</text>
  </g>
</svg>
