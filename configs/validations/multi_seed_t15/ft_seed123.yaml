# Multi-seed validation — AR-Binary (causal) somatosensory SSL -> T15, seed=123
# =============================================================================
# Finetunes the headline pretraining checkpoint (AR-Binary causal, ~10 h macaque
# Area 2 / S1, epoch 400) on T15. Together with seeds 10 and 42 this is the
# multi-seed reproducibility check of docs/results.md §6.1: mean validation PER
# 0.0925 +/- 0.0005 at the 250k-batch horizon set below.
#
# Note that these three runs vary the seed of the SSL arm only; the seed-paired
# SSL-vs-control comparison is the T12 experiment under
# configs/validations/cross_participant_t12/.
#
# For the 0.0887 headline, override the horizon:
#   --set num_training_batches=400000
output_dir: ${oc.env:JOB_OUT_DIR,trained_models/ssl_v2_multi_seed/ft_somatosensory_seed123}
checkpoint_dir: ${output_dir}/checkpoint

use_ema: false
seed: 123

model:
  decoder_type: transformer
  embed_dim: 384
  n_heads: 6
  n_layers: 7
  ff_dim: null
  head_dim: 512
  attn_dropout: 0.4
  rnn_dropout: 0.2
  patch_size: 5
  patch_stride: 5
  ssl_checkpoint: ${CHECKPOINT_DIR}/ssl_study/ar_binary_soma/epoch_0400.pt
  head_type: resffn
  head_num_blocks: 1
  head_norm: layernorm
  head_dropout: 0.1
  head_activation: gelu
  input_speckle_p: 0.0
  time_mask_ratio: 0.0
  time_mask_max_span: 15

dataset:
  batch_size: 32
  seed: 123
  data_transforms:
    white_noise_std: 0.8
    constant_offset_std: 0.2
    log_transform: true

epsilon: 1e-8
weight_decay: 0.0005
weight_decay_day: 0

num_training_batches: 250000
lr_scheduler_type: cosine
lr_max: 0.0003
lr_max_day: 0.0003
lr_min: 1e-06
lr_min_day: 1e-06
lr_decay_steps: ${num_training_batches}
lr_decay_steps_day: ${num_training_batches}
lr_warmup_steps: 1000
lr_warmup_steps_day: 1000

batches_per_val_step: 2000
save_best_checkpoint: true
save_all_val_steps: false
save_final_model: false
early_stopping: false

wandb:
  enabled: true
  project: brain2text
  run_name: ft_ssl_somatosensory_seed123
  group: ssl_v2_multi_seed
  tags: ["transformer", "ssl_v2", "somatosensory", "multi_seed", "seed123"]
